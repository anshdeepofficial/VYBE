<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Returning to VYBE...</title>
  <style>
    body{font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#111;color:#fff;text-align:center}
    main{max-width:32rem;padding:2rem}a{color:#b8c4ff}.spinner{width:38px;height:38px;border:4px solid #555;border-top-color:#fff;border-radius:50%;margin:0 auto 1.5rem;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
  </style>
</head>
<body><main><div class="spinner"></div><h1>Returning to VYBE</h1><p>Your secure Spotify authorization is complete.</p><p><a id="open" href="#">Open VYBE</a></p></main>
<script>
  const target = 'vybe://spotify-callback' + location.search;
  document.getElementById('open').href = target;
  location.replace(target);
</script></body>
</html>
